name: Unzip shiranui.zip

on:
  push:
    paths:
      - 'shiranui.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract zip and remove original
        run: |
          unzip -o shiranui.zip -d .
          rm shiranui.zip

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --staged --quiet; then
            git commit -m "Auto-unzip shiranui.zip"
            git push
          fi
